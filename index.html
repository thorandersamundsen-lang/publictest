<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#170e12">
  <title>Vinlotteriet — kveldens trekning</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7eee3;
      --muted: #b6a49e;
      --wine: #8d293d;
      --gold: #d7b477;
      --panel: rgba(43, 26, 31, .76);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 30%, rgba(119, 43, 57, .33), transparent 48%),
        radial-gradient(ellipse at 0% 100%, rgba(160, 111, 63, .12), transparent 40%),
        #170e12;
      font-family: Georgia, "Times New Roman", serif;
    }

    body::before {
      position: fixed;
      inset: 14px;
      border: 1px solid rgba(215, 180, 119, .18);
      content: "";
      pointer-events: none;
    }

    .app {
      width: min(100%, 520px);
      text-align: center;
      animation: arrive .8s ease-out both;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 0 16px;
      color: var(--gold);
      font: 600 11px/1.4 system-ui, sans-serif;
      letter-spacing: .3em;
      text-transform: uppercase;
    }

    .eyebrow::before, .eyebrow::after {
      width: 28px;
      height: 1px;
      background: var(--gold);
      content: "";
      opacity: .7;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 66px);
      font-weight: 400;
      letter-spacing: -.045em;
      line-height: 1;
    }

    h1 span { color: var(--gold); font-style: italic; }

    .intro {
      margin: 16px 0 28px;
      color: var(--muted);
      font: 14px/1.6 system-ui, sans-serif;
    }

    .draw-card {
      position: relative;
      padding: 30px 24px 24px;
      overflow: hidden;
      border: 1px solid rgba(215, 180, 119, .23);
      border-radius: 4px;
      background: linear-gradient(145deg, rgba(67, 39, 43, .83), var(--panel));
      box-shadow: 0 24px 70px rgba(0, 0, 0, .28), inset 0 1px rgba(255,255,255,.04);
    }

    .draw-card::before {
      position: absolute;
      top: -90px;
      left: 50%;
      width: 230px;
      height: 230px;
      border: 1px solid rgba(215, 180, 119, .1);
      border-radius: 50%;
      content: "";
      transform: translateX(-50%);
      box-shadow: 0 0 0 22px rgba(215, 180, 119, .025), 0 0 0 44px rgba(215, 180, 119, .02);
      pointer-events: none;
    }

    .number-label {
      position: relative;
      margin: 0;
      color: var(--muted);
      font: 600 10px/1.5 system-ui, sans-serif;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .number {
      position: relative;
      min-height: 154px;
      display: grid;
      place-items: center;
      color: var(--gold);
      font-size: clamp(112px, 30vw, 154px);
      font-variant-numeric: lining-nums tabular-nums;
      line-height: 1;
      text-shadow: 0 5px 35px rgba(215, 180, 119, .16);
    }

    .number.is-drawing { animation: tumble .12s linear infinite; }
    .number.is-winner { animation: reveal .6s cubic-bezier(.16, 1, .3, 1) both; }

    .status {
      min-height: 22px;
      margin: 2px 0 22px;
      color: var(--muted);
      font: 13px/1.5 system-ui, sans-serif;
    }

    .draw-button {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid #e4c78f;
      border-radius: 3px;
      color: #28161a;
      background: linear-gradient(135deg, #e3c58d, #c5a268);
      box-shadow: 0 7px 22px rgba(0, 0, 0, .2);
      cursor: pointer;
      font: 700 12px/1 system-ui, sans-serif;
      letter-spacing: .17em;
      text-transform: uppercase;
      transition: transform .2s, filter .2s, box-shadow .2s;
    }

    .draw-button:hover:not(:disabled) {
      filter: brightness(1.08);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .28);
      transform: translateY(-2px);
    }

    .draw-button:active:not(:disabled) { transform: translateY(0); }
    .draw-button:focus-visible, .reset-button:focus-visible { outline: 2px solid white; outline-offset: 4px; }
    .draw-button:disabled { cursor: default; opacity: .72; }

    .button-icon { font-size: 19px; line-height: 0; }

    .details {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
      color: var(--muted);
      font: 12px/1.5 system-ui, sans-serif;
    }

    .details strong { color: var(--ink); font-weight: 600; }

    .history {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 38px;
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }

    .history li {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(215, 180, 119, .4);
      border-radius: 50%;
      color: var(--gold);
      background: rgba(215, 180, 119, .07);
      font: 600 12px/1 system-ui, sans-serif;
      animation: arrive .3s ease-out both;
    }

    .history-empty { color: #8f7d78; font: 12px/1.5 system-ui, sans-serif; }

    .reset-button {
      margin-top: 26px;
      padding: 8px 12px;
      border: 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font: 12px/1.5 system-ui, sans-serif;
      text-decoration: underline;
      text-decoration-color: rgba(182, 164, 158, .45);
      text-underline-offset: 4px;
    }

    .reset-button:hover { color: var(--ink); }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes tumble {
      0% { opacity: .35; transform: translateY(-5px) scale(.98); }
      100% { opacity: 1; transform: translateY(5px) scale(1.02); }
    }
    @keyframes reveal {
      0% { opacity: 0; transform: scale(.72); }
      65% { opacity: 1; transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @media (max-width: 420px) {
      .draw-card { padding: 25px 18px 20px; }
      .details { font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <p class="eyebrow">Den store trekningen</p>
    <h1>Vin<span>lotteriet</span></h1>
    <p class="intro">Lykke til — kanskje det er din tur i kveld.</p>

    <section class="draw-card" aria-label="Trekning av vinnernummer">
      <p class="number-label">Kveldens vinnernummer</p>
      <div class="number" id="number" aria-hidden="true">—</div>
      <p class="status" id="status" aria-live="polite">Trykk på knappen for å trekke et nummer</p>
      <button class="draw-button" id="draw-button" type="button">
        <span class="button-icon" aria-hidden="true">✦</span>
        <span id="button-label">Trekk vinner</span>
      </button>
      <div class="details">
        <span>Nummer <strong>1–100</strong></span>
        <span>Trukket <strong id="draw-count">0</strong> av 100</span>
      </div>
    </section>

    <ul class="history" id="history" aria-label="Tidligere trukne vinnere">
      <li class="history-empty">Vinnernumrene vises her</li>
    </ul>
    <button class="reset-button" id="reset-button" type="button">Nullstill trekningen</button>
  </main>

  <script>
    (() => {
      const numberDisplay = document.getElementById("number");
      const status = document.getElementById("status");
      const drawButton = document.getElementById("draw-button");
      const buttonLabel = document.getElementById("button-label");
      const drawCount = document.getElementById("draw-count");
      const history = document.getElementById("history");
      const resetButton = document.getElementById("reset-button");
      const drawnNumbers = new Set();
      const randomBuffer = new Uint32Array(1);
      let animationTimer;

      function randomIndex(max) {
        const range = 0x100000000;
        const limit = range - (range % max);
        let value;
        do {
          window.crypto.getRandomValues(randomBuffer);
          value = randomBuffer[0];
        } while (value >= limit);
        return value % max;
      }

      function updateHistory() {
        history.replaceChildren();
        if (drawnNumbers.size === 0) {
          const empty = document.createElement("li");
          empty.className = "history-empty";
          empty.textContent = "Vinnernumrene vises her";
          history.append(empty);
        } else {
          Array.from(drawnNumbers).reverse().forEach((value) => {
            const item = document.createElement("li");
            item.textContent = value;
            history.append(item);
          });
        }
        drawCount.textContent = drawnNumbers.size;
      }

      drawButton.addEventListener("click", () => {
        if (drawnNumbers.size === 100) return;

        drawButton.disabled = true;
        resetButton.disabled = true;
        buttonLabel.textContent = "Trekker …";
        status.textContent = "Spennende — vinnernummeret trekkes nå";
        numberDisplay.classList.remove("is-winner");
        numberDisplay.classList.add("is-drawing");

        animationTimer = window.setInterval(() => {
          numberDisplay.textContent = randomIndex(100) + 1;
        }, 65);

        window.setTimeout(() => {
          window.clearInterval(animationTimer);
          const available = Array.from({ length: 100 }, (_, index) => index + 1)
            .filter((value) => !drawnNumbers.has(value));
          const winner = available[randomIndex(available.length)];
          drawnNumbers.add(winner);

          numberDisplay.textContent = winner;
          numberDisplay.classList.remove("is-drawing");
          void numberDisplay.offsetWidth;
          numberDisplay.classList.add("is-winner");
          status.textContent = "Gratulerer, nummer " + winner + " vant!";
          buttonLabel.textContent = drawnNumbers.size === 100 ? "Alle numre er trukket" : "Trekk neste vinner";
          drawButton.disabled = drawnNumbers.size === 100;
          resetButton.disabled = false;
          updateHistory();
        }, 1500);
      });

      resetButton.addEventListener("click", () => {
        drawnNumbers.clear();
        numberDisplay.textContent = "—";
        numberDisplay.classList.remove("is-winner", "is-drawing");
        status.textContent = "Trykk på knappen for å trekke et nummer";
        buttonLabel.textContent = "Trekk vinner";
        drawButton.disabled = false;
        resetButton.disabled = false;
        updateHistory();
      });
    })();
  </script>
</body>
</html>
